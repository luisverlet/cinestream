server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir streams y subidas de cualquier tamaño sin límite de buffer
    client_max_body_size 0;

    # Compresión Gzip para Smart TVs y dispositivos móviles de bajo consumo
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # PROXY API GATEWAY (FastAPI BFF)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # WebSockets & Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forzar HTTPS para evitar bloqueo de contenido mixto tras Cloudflare Tunnel
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol https;
        proxy_set_header X-Forwarded-Host $http_host;

        # Timeouts generosos para búsqueda de torrents y llamadas a indexadores
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # PROXY JELLYFIN (Transcodificación, HLS .m3u8/.ts Chunks y WebSockets)
    # --------------------------------------------------------------------------
    location /jellyfin {
        proxy_pass http://jellyfin:8096;
        proxy_http_version 1.1;

        # WebSockets para sincronización de sesión y control de reproducción
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forzar HTTPS para que Jellyfin sepa que el cliente externo usa SSL
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol https;
        proxy_set_header X-Forwarded-Host $http_host;

        # Desactivar buffering para streaming fluido en iPhone, Fire TV y LG webOS
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_force_ranges on;
        client_max_body_size 0;

        # Timeouts de 10 minutos para mantener stream continuo sin cortes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # CACHÉ ESTÁTICA PARA BUNDLE PREACT + VITE
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # SPA ROUTING FALLBACK
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

